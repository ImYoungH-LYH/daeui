name: OpenWrt packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  app:
    name: Build DaeUI binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: npm ci
      - run: npm test
      - name: Go tests
        working-directory: server
        run: go test ./...
      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in [0-9]*) ;; *) VERSION="$(node -p 'require("./package.json").version')" ;; esac
          echo "DAEUI_VERSION=$VERSION" >> "$GITHUB_ENV"
          DAEUI_VERSION="$VERSION" node scripts/build-server.mjs amd64
      - uses: actions/upload-artifact@v4
        with:
          name: daeui-bin
          path: build/daeui-linux-amd64

  sdk:
    name: dae / daeui packages
    needs: app
    runs-on: ubuntu-latest
    container:
      # dae and daeui do not depend on the kernel build, so one SDK is enough.
      image: openwrt/sdk:x86-64-v25.12.5
      options: --user root
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: daeui-bin
          path: daeui-bin
      - name: Prepare SDK
        working-directory: /builder
        run: |
          # Release images ship with the SDK already unpacked (setup.sh ran at image build).
          [ -x ./scripts/feeds ] || ./setup.sh
          ./scripts/feeds update base
          ./scripts/feeds install -a -p base
          mkdir -p package/daeui-pkgs
          cp -r "$GITHUB_WORKSPACE"/packaging/openwrt/dae "$GITHUB_WORKSPACE"/packaging/openwrt/daeui package/daeui-pkgs/
          install -m 0755 "$GITHUB_WORKSPACE/daeui-bin/daeui-linux-amd64" package/daeui-pkgs/daeui/files/daeui-x86_64
          make defconfig
          printf 'CONFIG_PACKAGE_dae=m\nCONFIG_PACKAGE_daeui=m\n' >> .config
          make defconfig
          # defconfig silently drops packages whose dependencies cannot be met.
          for p in dae daeui; do
            grep -q "^CONFIG_PACKAGE_$p=m" .config || { echo "package $p is not selectable (unmet DEPENDS?)" >&2; exit 1; }
          done
      - name: Build dae and daeui
        working-directory: /builder
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in [0-9]*) ;; *) VERSION="$(sed -n 's/.*"version": "\(.*\)".*/\1/p' "$GITHUB_WORKSPACE/package.json")" ;; esac
          make package/dae/compile V=s
          make package/daeui/compile V=s DAEUI_VERSION="$VERSION"
      - name: Collect
        working-directory: /builder
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$(find bin -name 'dae-[0-9]*.apk' | head -n1)" "$GITHUB_WORKSPACE/out/dae-x86_64.apk"
          cp "$(find bin -name 'daeui-[0-9]*.apk' | head -n1)" "$GITHUB_WORKSPACE/out/daeui-x86_64.apk"
          ls -la "$GITHUB_WORKSPACE/out"
      - uses: actions/upload-artifact@v4
        with:
          name: apks-app
          path: out/*.apk

  btf:
    name: vmlinux-btf for OpenWrt ${{ matrix.release }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        # The official SDK ships no kernel sources, so rebuild the release kernel from the
        # official buildroot + buildinfo and prove it matches via the published vermagic.
        release: ['25.12.5', '25.12.6']
    env:
      REL: ${{ matrix.release }}
      DL: https://downloads.openwrt.org/releases/${{ matrix.release }}/targets/x86/64
    steps:
      - uses: actions/checkout@v4
        with:
          path: daeui
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools python3-dev rsync swig unzip zlib1g-dev file wget \
            libelf-dev libdw-dev cmake zstd bc
          curl -fsSL --retry 3 https://fedorapeople.org/~acme/dwarves/dwarves-1.28.tar.bz2 -o /tmp/dwarves.tar.bz2
          echo '826efc0fc9237d3c1e9c01553ea387a8cb46e8dc119ff863889043f4ed54b2ae  /tmp/dwarves.tar.bz2' | sha256sum -c -
          tar -xjf /tmp/dwarves.tar.bz2 -C /tmp
          cmake -S /tmp/dwarves-1.28 -B /tmp/dwarves-build -D__LIB=lib -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build /tmp/dwarves-build -j"$(nproc)" >/dev/null
          sudo cmake --install /tmp/dwarves-build >/dev/null
          sudo ldconfig
          pahole --version
      - name: Official buildroot at the release commit
        run: |
          curl -fsSL "$DL/version.buildinfo" -o version.buildinfo
          curl -fsSL "$DL/feeds.buildinfo" -o feeds.buildinfo
          curl -fsSL "$DL/config.buildinfo" -o config.buildinfo
          curl -fsSL "$DL/profiles.json" -o profiles.json
          git clone --filter=blob:none --branch "v$REL" https://github.com/openwrt/openwrt.git openwrt
          # The release tag adds a "version" file naming the revision the buildbot built.
          [ "$(cat openwrt/version)" = "$(cat version.buildinfo)" ] || { echo "openwrt/version is $(cat openwrt/version), official build is $(cat version.buildinfo)" >&2; exit 1; }
          echo "buildroot revision $(cat openwrt/version) matches the official build"
          cp feeds.buildinfo openwrt/feeds.conf
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp ../config.buildinfo .config
          # Drop release outputs that do not influence the kernel build.
          sed -i -E '/^CONFIG_(IB|SDK|SDK_LLVM_BPF|MAKE_TOOLCHAIN|JSON_CYCLONEDX_SBOM)=y$/d' .config
          make defconfig
      - name: Tools and toolchain
        working-directory: openwrt
        run: make -j"$(nproc)" tools/install toolchain/install || make tools/install toolchain/install V=s
      - name: Release kernel
        working-directory: openwrt
        run: |
          make -j"$(nproc)" target/linux/compile || make target/linux/compile V=s
          ours="$(cat build_dir/target-*/linux-*/linux-*/.vermagic)"
          official="$(sed -nE 's/.*"vermagic":"([0-9a-f]+)".*/\1/p' ../profiles.json)"
          echo "vermagic ours=$ours official=$official"
          [ -n "$official" ] && [ "$ours" = "$official" ] || { echo "Kernel config differs from the official build; refusing to publish BTF" >&2; exit 1; }
      - name: vmlinux-btf
        working-directory: openwrt
        run: |
          cp -r ../daeui/packaging/openwrt/vmlinux-btf package/
          echo 'CONFIG_PACKAGE_vmlinux-btf=m' >> .config
          make defconfig
          grep -q '^CONFIG_PACKAGE_vmlinux-btf=m' .config || { echo "vmlinux-btf is not selectable" >&2; exit 1; }
          make package/vmlinux-btf/compile V=s -j"$(nproc)"
          mkdir -p ../out
          btf="$(find bin -name 'vmlinux-btf-[0-9]*.apk' | head -n1)"
          kver="$(basename "$btf" | sed -E 's/^vmlinux-btf-([0-9.]+)-r[0-9]+\.apk$/\1/')"
          cp "$btf" "../out/vmlinux-btf-${kver}-x86_64.apk"
          ls -la ../out
      - uses: actions/upload-artifact@v4
        with:
          name: apks-btf-${{ matrix.release }}
          path: out/*.apk

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [sdk, btf]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: apks-*
          path: apks
      - name: Assemble assets
        run: |
          mkdir -p assets
          # dae/daeui are identical across point releases; vmlinux-btf differs per kernel.
          find apks -name '*.apk' -exec cp -n {} assets/ \;
          cp scripts/install-openwrt.sh assets/
          (cd assets && sha256sum * > SHA256SUMS)
          ls -la assets
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" assets/* --title "$GITHUB_REF_NAME" --generate-notes
